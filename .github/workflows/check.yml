name: Registry account check

on:
  push:
    branches:
      - main
      - release/reconciled-prelaunch-backend-clean-20260824
  pull_request:
    branches:
      - main
      - release/reconciled-prelaunch-backend-clean-20260824

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke
