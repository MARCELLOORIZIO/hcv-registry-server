name: Registry account check

on:
  push:
    branches:
      - main
      - release/reconciled-prelaunch-backend-clean-20260824
  pull_request:
    branches:
      - main
      - release/reconciled-prelaunch-backend-clean-20260824

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigillum
          POSTGRES_PASSWORD: sigillum
          POSTGRES_DB: sigillum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigillum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sigillum:sigillum@127.0.0.1:5432/sigillum
      NODE_ENV: test
      PG_SSL_REQUIRED: "false"
      TEST_FIXED_CODE: "123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke
