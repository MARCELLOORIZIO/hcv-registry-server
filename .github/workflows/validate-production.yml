name: Validate SIGILLUM production backend

on:
  push:
    branches:
      - commercial/prelaunch-20260811
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigillum
          POSTGRES_PASSWORD: sigillum
          POSTGRES_DB: sigillum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigillum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sigillum:sigillum@127.0.0.1:5432/sigillum
      NODE_ENV: test
      PRODUCTION_LIVE: "false"
      SUBSCRIPTIONS_ENFORCED: "false"
      KYC_REQUIRES_SUBSCRIPTION: "true"
      TEST_FIXED_CODE: "123456"
      PG_SSL_REQUIRED: "false"
      APPLE_BILLING_TEST_MODE: "true"
      APPLE_BUNDLE_ID: com.sigillum.hcv
      APPLE_MONTHLY_PRODUCT_ID: com.sigillum.hcv.creator.monthly
      APPLE_ANNUAL_PRODUCT_ID: com.sigillum.hcv.creator.annual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax and safety checks
        run: npm run check
      - name: Verify LIVE production guard
        run: node production_config_test.js | tee production-config.json
      - name: Start production server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > health.json; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Verify health and legal endpoints
        run: |
          cat health.json
          grep -q 'sigillum-production-postgres' health.json
          grep -q '"productionLive":false' health.json
          grep -q '"readyForLive":false' health.json
          curl -fsS 'http://127.0.0.1:8080/privacy?lang=it' | grep -q 'MAORI DI MARCELLO ORIZIO'
          curl -fsS 'http://127.0.0.1:8080/terms?lang=it' | grep -q 'Termini di Servizio SIGILLUM'
      - name: Verify unauthenticated certificate writes are blocked
        run: |
          STATUS=$(curl -s -o unauth.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/certificate -H 'Content-Type: application/json' -d '{"hcvId":"HCV-AAAAAAAAAAAAAAAA","certificateRaw":"{}"}')
          test "$STATUS" = "401"
      - name: Run authenticated account and Apple billing flow
        run: node production_smoke_test.js | tee account-smoke.json
      - name: Run PostgreSQL-backed load probe
        env:
          LOAD_DURATION_MS: "10000"
          LOAD_CONCURRENCY: "25"
        run: node load_test.js | tee load-result.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigillum-production-backend-logs
          path: |
            server.log
            health.json
            unauth.json
            production-config.json
            account-smoke.json
            load-result.json
          if-no-files-found: ignore
