name: Validate Phase D Registry Security

on:
  push:
    branches:
      - phase-d-registry-provenance-20260902

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test:registry-security
      - run: npm run smoke
