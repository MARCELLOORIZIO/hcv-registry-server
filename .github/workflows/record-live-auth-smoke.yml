name: Record live Account smoke result

on:
  push:
    paths:
      - '.github/workflows/record-live-auth-smoke.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Run and record checks
        run: |
          set +e
          npm run check > /tmp/check.log 2>&1
          CHECK_STATUS=$?
          npm run smoke > /tmp/smoke.log 2>&1
          SMOKE_STATUS=$?
          mkdir -p ci
          {
            echo "check_status=$CHECK_STATUS"
            echo "smoke_status=$SMOKE_STATUS"
            echo "--- check ---"
            cat /tmp/check.log
            echo "--- smoke ---"
            cat /tmp/smoke.log
          } > ci/live-auth-smoke-result.txt
          git config user.name 'SIGILLUM Registry Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/live-auth-smoke-result.txt
          git commit -m 'Record live Account server smoke result'
          git push origin HEAD:main
