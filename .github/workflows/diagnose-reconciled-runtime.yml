name: Diagnose reconciled backend runtime

on:
  push:
    branches:
      - commercial/reconciled-prelaunch-20260824
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  runtime-diagnosis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigillum
          POSTGRES_PASSWORD: sigillum
          POSTGRES_DB: sigillum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigillum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sigillum:sigillum@127.0.0.1:5432/sigillum
      NODE_ENV: test
      PRODUCTION_LIVE: "false"
      CERTIFICATE_WRITES_ENABLED: "false"
      SUBSCRIPTIONS_ENFORCED: "false"
      KYC_REQUIRES_SUBSCRIPTION: "true"
      TEST_FIXED_CODE: "123456"
      PG_SSL_REQUIRED: "false"
      APPLE_BILLING_TEST_MODE: "true"
      APPLE_BUNDLE_ID: com.sigillum.hcv
      APPLE_MONTHLY_PRODUCT_ID: com.sigillum.hcv.creator.monthly
      APPLE_ANNUAL_PRODUCT_ID: com.sigillum.hcv.creator.annual
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mark runner ready
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-runner"}'
      - run: npm install
      - name: Mark install success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-install"}'
      - run: npm run check
      - name: Mark check success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-check"}'
      - run: node production_config_test.js
      - name: Mark config success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-config"}'
      - name: Start prelaunch server
        run: |
          npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > health.json; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Mark server success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-server"}'
      - name: Public endpoints
        run: |
          grep -q '"certificateWritesEnabled":false' health.json
          curl -fsS http://127.0.0.1:8080/.well-known/apple-app-site-association > aasa.json
          grep -Fq '"/verify/*"' aasa.json
          grep -Fq '"/v/*"' aasa.json
          curl -fsS 'http://127.0.0.1:8080/terms?lang=it' | grep -q 'Termini di Servizio SIGILLUM'
          curl -fsS 'http://127.0.0.1:8080/terms?lang=en' | grep -q 'SIGILLUM Terms of Service'
      - name: Mark public success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-public"}'
      - name: Writes disabled
        run: |
          STATUS=$(curl -s -o unauth.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/certificate -H 'Content-Type: application/json' -d '{"hcvId":"HCV-AAAAAAAAAAAAAAAA","certificateRaw":"{}"}')
          test "$STATUS" = "503"
          grep -q 'CERTIFICATE_WRITES_DISABLED' unauth.json
      - name: Mark writes success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-writes"}'
      - name: Creator smoke
        run: |
          PORT=8081 CERTIFICATE_WRITES_ENABLED=true npm start > smoke.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/health > smoke-health.json; then break; fi
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:8081 node production_smoke_test.js
      - name: Mark smoke success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-smoke"}'
      - name: Load probe
        env:
          LOAD_DURATION_MS: "10000"
          LOAD_CONCURRENCY: "25"
        run: node load_test.js
      - name: Mark load success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/diag-load"}'
