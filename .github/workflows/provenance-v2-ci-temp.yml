name: Provenance v2 temporary validation

on:
  push:
    branches:
      - feature/registry-provenance-v2-20260831

permissions:
  contents: read

jobs:
  backend-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize production runtime
        run: npm run precheck

      - name: Run backend checks
        run: npm run check

      - name: Prove provenance runtime remains materialized
        run: |
          grep -F "SIGILLUM REGISTRY VERIFIED" production_server.js
          grep -F "provenanceEnvelopeFromRow(row)" production_server.js
          git diff -- production_server.js
