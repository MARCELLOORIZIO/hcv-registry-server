name: Provenance v2 temporary validation

on:
  push:
    branches:
      - feature/registry-provenance-v2-20260831

permissions:
  contents: read

jobs:
  backend-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run backend checks with single materialization
        run: npm run check

      - name: Prove provenance runtime remains materialized
        run: |
          grep -F "SIGILLUM REGISTRY VERIFIED" production_server.js
          grep -F "provenanceEnvelopeFromRow(row)" production_server.js

      - name: Inspect creator access contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('production_server.js').read_text(encoding='utf-8')
          i = s.find('async function requireCreatorAccess')
          if i < 0:
              raise SystemExit('requireCreatorAccess not found')
          print(s[i:i+2600])
          PY
