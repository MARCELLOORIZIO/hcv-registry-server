name: Fix live Account API errors

on:
  push:
    paths:
      - '.github/workflows/fix-live-auth-error-boundary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Account error boundary
        run: python3 tool/fix_live_auth_error_boundary.py
      - run: npm install --no-audit --no-fund
      - name: Verify syntax and full Account lifecycle
        run: |
          npm run check
          npm run smoke
      - name: Commit verified Account API correction
        run: |
          git config user.name 'SIGILLUM Registry Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add auth_api.js
          git commit -m 'Return correct HTTP errors from live Account endpoints'
          git push origin HEAD:main
