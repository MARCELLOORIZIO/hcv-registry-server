name: SIGILLUM Connector Boundary
on:
  push:
    branches: [feature/sigillum-chatgpt-connector-contract-20261012]
  pull_request:
    paths:
      - sigillum_connector_bridge.js
      - sigillum_connector_bridge_test.js
      - sigillum_mcp_dispatcher.js
      - sigillum_mcp_dispatcher_test.js
      - sigillum_connector_grant_adapter.js
      - sigillum_connector_grant_adapter_test.js
      - sigillum_connector_r2_capture.js
      - sigillum_connector_r2_capture_test.js
      - sigillum_mcp_service.js
      - sigillum_mcp_service_test.js
      - sigillum_mcp_auth.js
      - sigillum_mcp_auth_test.js
      - sigillum_mcp_http.js
      - sigillum_mcp_http_test.js
      - sigillum_mcp_credentials.js
      - sigillum_mcp_credentials_test.js
      - verified_originals_production.js
      - sigillum_connector_production_test.js
      - sigillum_connector_audit_request.js
      - sigillum_connector_audit_request_test.js
      - delegated_reference_audit.js
      - delegated_reference_audit_ui.js
      - migrations/20261012_sigillum_connector_principal.sql
      - migrations/20261012_sigillum_mcp_credentials.sql
      - .github/workflows/sigillum-connector-boundary.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sigillum_connector_bridge.js
      - run: node --check sigillum_mcp_dispatcher.js
      - run: node --check sigillum_connector_grant_adapter.js
      - run: node --check sigillum_connector_r2_capture.js
      - run: node --check sigillum_mcp_service.js
      - run: node --check sigillum_mcp_auth.js
      - run: node --check sigillum_mcp_http.js
      - run: node --check sigillum_mcp_credentials.js
      - name: Install isolated SQL fixture dependency
        run: npm install --prefix /tmp/sigillum-connector-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.9
      - name: Exercise Registry factory and existing encrypted R2 reader
        run: NODE_PATH=/tmp/sigillum-connector-test/node_modules node --test sigillum_connector_production_test.js sigillum_connector_audit_request_test.js
      - run: node --test sigillum_connector_bridge_test.js sigillum_mcp_dispatcher_test.js sigillum_connector_grant_adapter_test.js sigillum_connector_r2_capture_test.js sigillum_mcp_service_test.js sigillum_mcp_auth_test.js sigillum_mcp_http_test.js sigillum_mcp_credentials_test.js
