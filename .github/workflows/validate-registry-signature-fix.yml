name: Validate Registry signature compatibility fix

on:
  push:
    branches:
      - fix/registry-dart-signature-canonical-20260816

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Run canonical signature regression and syntax checks
        run: npm run check
      - name: Verify production patch is present after precheck
        run: |
          grep -q "signedPayloadFromRawCertificate(raw)" production_server.js
          grep -q "require('./hcv_signature_canonical')" production_server.js
