name: R2 primary provider acceptance

on:
  push:
    branches:
      - feature/r2-primary-reference-lifecycle-20261002
    paths:
      - tool/r2_primary_provider_acceptance.js
      - .github/workflows/r2-primary-provider-acceptance.yml
      - primary_reference_provider.js
  workflow_dispatch:
    inputs:
      payload_mb:
        description: Synthetic payload size in MB
        required: true
        default: '100'

permissions:
  contents: read

jobs:
  r2-primary-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_REQUIRE_EU: 'true'
      R2_PROVIDER_ACCEPTANCE_MB: ${{ inputs.payload_mb || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run real R2 primary-provider acceptance
        run: node tool/r2_primary_provider_acceptance.js
