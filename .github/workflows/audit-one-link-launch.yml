name: Audit one-link launch test
on:
  push:
    branches: [feature/audit-one-link-start-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check delegated_reference_audit_ui.js
      - run: node --test audit_one_link_start_test.js
