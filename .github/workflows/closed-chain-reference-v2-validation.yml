name: Closed-chain reference v2 validation

on:
  push:
    branches:
      - feature/closed-chain-reference-v2-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-chain-reference-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigillum
          POSTGRES_PASSWORD: sigillum
          POSTGRES_DB: sigillum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigillum -d sigillum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sigillum:sigillum@127.0.0.1:5432/sigillum_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply production patches
        run: npm run precheck
      - name: Full backend checks
        run: npm run check
      - name: Verified Originals integration
        run: node verified_originals_production_test.js
