name: Sync R2 credentials to Render PRELAUNCH

on:
  push:
    branches:
      - ops/sync-r2-render-secrets-20261002
    paths:
      - '.github/workflows/sync-r2-render-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Validate secret presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY_MISSING}"
          service_id="${RENDER_SERVICE_ID:-srv-d9u3inbm8hqs73eee5g0}"
          : "${R2_ENDPOINT:?R2_ENDPOINT_MISSING}"
          : "${R2_BUCKET:?R2_BUCKET_MISSING}"
          : "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID_MISSING}"
          : "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY_MISSING}"
          echo "RENDER_SERVICE_ID=$service_id" >> "$GITHUB_ENV"

      - name: Sync R2 service environment variables
        shell: bash
        run: |
          set -euo pipefail
          update_env() {
            local key="$1"
            local value="$2"
            body="$(jq -nc --arg value "$value" '{value:$value}')"
            curl --fail-with-body --silent --show-error --max-time 30               -X PUT               -H "Authorization: Bearer $RENDER_API_KEY"               -H "Accept: application/json"               -H "Content-Type: application/json"               --data "$body"               "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key"               >/dev/null
          }

          update_env R2_ENDPOINT "$R2_ENDPOINT"
          update_env R2_BUCKET "$R2_BUCKET"
          update_env R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          update_env R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          update_env R2_REQUIRE_EU "true"

          echo "R2_RENDER_SECRET_SYNC=PASS"
          echo "Primary provider and master encryption key intentionally unchanged."
