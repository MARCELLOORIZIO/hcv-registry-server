name: Verify Render live prelaunch state

on:
  push:
    branches:
      - commercial/reconciled-prelaunch-20260824
    paths:
      - .github/workflows/verify-render-live-prelaunch.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: https://sigillum-registry-production.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mark verification pending
        run: |
          curl -fsS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"sigillum/render-live-prelaunch","description":"Checking live Render prelaunch state"}'
      - name: Verify live health flags
        run: |
          curl -fsS "$BASE_URL/health" | tee render-health.json
          grep -q '"database":true' render-health.json
          grep -q '"certificateWritesEnabled":false' render-health.json
          grep -q '"productionLive":false' render-health.json
          grep -q '"termsVersion":"2026-08-18"' render-health.json
          grep -q '"privacyVersion":"2026-08-18"' render-health.json
      - name: Mark health success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-health"}'
      - name: Verify AASA
        run: |
          curl -fsS "$BASE_URL/.well-known/apple-app-site-association" | tee render-aasa.json
          grep -Fq 'DN9W7Z3HCZ.com.sigillum.hcv' render-aasa.json
          grep -Fq '"/verify/*"' render-aasa.json
          grep -Fq '"/v/*"' render-aasa.json
      - name: Mark AASA success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-aasa"}'
      - name: Verify multilingual legal endpoints
        run: |
          curl -fsS "$BASE_URL/terms?lang=it" | grep -q 'Termini di Servizio SIGILLUM'
          curl -fsS "$BASE_URL/terms?lang=en" | grep -q 'SIGILLUM Terms of Service'
          curl -fsS "$BASE_URL/terms?lang=es" | grep -q 'Términos de Servicio de SIGILLUM'
          curl -fsS "$BASE_URL/terms?lang=ru" | grep -q 'Условия использования SIGILLUM'
      - name: Mark legal success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-legal"}'
      - name: Run read-only Render health load probe
        env:
          LOAD_BASE_URL: https://sigillum-registry-production.onrender.com
          LOAD_DURATION_MS: "10000"
          LOAD_CONCURRENCY: "25"
        run: node load_test.js | tee render-load-result.json
      - name: Mark load success
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-load"}'
      - name: Mark verification success
        if: success()
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-live-prelaunch","description":"Render live prelaunch verification passed"}'
      - name: Mark verification failure
        if: failure()
        run: |
          curl -sS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"sigillum/render-live-prelaunch","description":"Render live prelaunch verification failed"}' || true
      - name: Upload live verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigillum-render-live-prelaunch
          path: |
            render-health.json
            render-aasa.json
            render-load-result.json
          if-no-files-found: ignore
