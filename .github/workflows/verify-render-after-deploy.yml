name: Verify Render after deploy

on:
  push:
    branches:
      - commercial/reconciled-prelaunch-20260824
    paths:
      - .github/workflows/verify-render-after-deploy.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: https://sigillum-registry-production.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Health
        run: |
          curl -fsS "$BASE_URL/health" | tee render-health.json
          grep -q '"database":true' render-health.json
          grep -q '"certificateWritesEnabled":false' render-health.json
          grep -q '"productionLive":false' render-health.json
          grep -q '"termsVersion":"2026-08-18"' render-health.json
          grep -q '"privacyVersion":"2026-08-18"' render-health.json
      - name: Mark health
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-after-health"}'
      - name: AASA and legal
        run: |
          curl -fsS "$BASE_URL/.well-known/apple-app-site-association" | tee render-aasa.json
          grep -Fq 'DN9W7Z3HCZ.com.sigillum.hcv' render-aasa.json
          grep -Fq '"/verify/*"' render-aasa.json
          grep -Fq '"/v/*"' render-aasa.json
          curl -fsS "$BASE_URL/terms?lang=it" | grep -q 'Termini di Servizio SIGILLUM'
          curl -fsS "$BASE_URL/terms?lang=en" | grep -q 'SIGILLUM Terms of Service'
          curl -fsS "$BASE_URL/terms?lang=es" | grep -q 'Términos de Servicio de SIGILLUM'
          curl -fsS "$BASE_URL/terms?lang=ru" | grep -q 'Условия использования SIGILLUM'
      - name: Mark public
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-after-public"}'
      - name: Read-only load probe
        env:
          LOAD_BASE_URL: https://sigillum-registry-production.onrender.com
          LOAD_DURATION_MS: "10000"
          LOAD_CONCURRENCY: "25"
        run: node load_test.js | tee render-load-result.json
      - name: Mark load
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-after-load"}'
      - name: Mark overall success
        if: success()
        run: |
          curl -fsS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"success","context":"sigillum/render-after-deploy"}'
      - name: Mark overall failure
        if: failure()
        run: |
          curl -sS -L -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d '{"state":"failure","context":"sigillum/render-after-deploy"}' || true
