services:
  - type: web
    name: sigillum-registry-production
    runtime: node
    region: frankfurt
    plan: starter
    branch: release/reconciled-prelaunch-backend-clean-20260824
    autoDeployTrigger: off
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sigillum-registry-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PRODUCTION_LIVE
        value: "false"
      - key: PG_POOL_MAX
        value: "10"
      - key: PG_SSL_REQUIRED
        value: "false"
      - key: CERTIFICATE_WRITES_ENABLED
        value: "false"
      - key: SUBSCRIPTIONS_ENFORCED
        value: "false"
      - key: KYC_REQUIRES_SUBSCRIPTION
        value: "true"
      - key: TERMS_VERSION
        value: "2026-10-04"
      - key: PRIVACY_VERSION
        value: "2026-10-04"
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: APPLE_BUNDLE_ID
        value: "com.sigillum.hcv"
      - key: APPLE_WEEKLY_PRODUCT_ID
        value: "com.sigillum.hcv.creator.weekly"
      - key: APPLE_MONTHLY_PRODUCT_ID
        value: "com.sigillum.hcv.creator.monthly"
      - key: APPLE_ANNUAL_PRODUCT_ID
        value: "com.sigillum.hcv.creator.annual"
      - key: APPLE_IAP_ENVIRONMENT
        value: "AUTO"
      - key: APPLE_APP_ID
        sync: false
      - key: APPLE_IAP_ISSUER_ID
        sync: false
      - key: APPLE_IAP_KEY_ID
        sync: false
      - key: APPLE_IAP_PRIVATE_KEY_BASE64
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SIGILLUM_KYC_RETURN_URL
        sync: false
      - key: SIGILLUM_PRIMARY_REFERENCE_PROVIDER
        value: "r2"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: "sigillum-hcv-references-eu"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REQUIRE_EU
        value: "true"
      - key: R2_REFERENCE_ACTIVE_KEY_ID
        sync: false
      - key: R2_REFERENCE_MASTER_KEYS_JSON
        sync: false
      - key: R2_REFERENCE_READ_TTL_SECONDS
        value: "60"
      - key: SIGILLUM_PUBLISHER_ID
        value: "SIGILLUM_R2_PRIMARY_V2"
      - key: SIGILLUM_DERIVATION_KEY_ID
        value: "sigillum_derivation_prod_v1"
      - key: SIGILLUM_DERIVATION_PRIVATE_KEY_PEM
        sync: false
      - key: SIGILLUM_DERIVATION_PUBLIC_KEYS_JSON
        sync: false
      - key: SIGILLUM_VERIFIED_ORIGINALS_MAX_BYTES
        value: "536870912"

databases:
  - name: sigillum-registry-db
    region: frankfurt
    plan: basic-256mb
    databaseName: sigillum
    user: sigillum
